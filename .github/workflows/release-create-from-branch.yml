name: Release create from branch

on:
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: 'Pre-release — cuts RC tag (false strips RC suffix and cuts stable tag)'
        required: true
        default: true
        type: boolean
      dry_run:
        description: 'Dry run — skip all writes (tag, release, Docker push, Helm)'
        required: true
        default: true
        type: boolean
env:
  CONTAINER_REGISTRY: docker.io
  CONTAINER_IMAGE_NAME: linode/apl-core
  RELEASE_BRANCH: ${{ github.ref_name }}
  RELEASE_BRANCH_PREFIX: 'releases/'
  RELEASE_TAG_PREFIX: 'v'

jobs:
  release-get-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.compute-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          fetch-tags: true

      - name: Validate branch, compute release tag, and check it does not already exist
        id: compute-tag
        uses: linode/apl-gh-actions/actions/release-get-tag@v0.3.0
        with:
          is_prerelease: ${{ inputs.is_prerelease }}
          release_branch: ${{ env.RELEASE_BRANCH }}
          release_branch_prefix: ${{ env.RELEASE_BRANCH_PREFIX }}
          release_tag_prefix: ${{ env.RELEASE_TAG_PREFIX }}
          require_rc_before_stable: false
          check_tag_not_exists: true
          validate_branch: true

  validate-deps:
    needs: release-get-tag
    permissions:
      contents: read
    uses: linode/apl-gh-actions/.github/workflows/validate-deps.yml@v0.3.0
    with:
      release_branch: ${{ github.ref_name }}
      is_prerelease: ${{ inputs.is_prerelease }}

  release-from-branch:
    needs:
      - release-get-tag
      - validate-deps
    permissions:
      contents: write
    uses: linode/apl-gh-actions/.github/workflows/release-software.yml@v0.3.0
    with:
      release_branch: ${{ github.ref_name }}
      is_prerelease: ${{ inputs.is_prerelease }}
      dry_run: ${{ inputs.dry_run }}
      container_registry: 'docker.io'
      container_image: 'linode/apl-core'
      release_tag: ${{ needs.release-get-tag.outputs.release_tag }}
    secrets:
      oci_password: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}
      oci_username: ${{ secrets.DOCKERHUB_LINODEBOT_USERNAME }}
  release-helm-chart:
    needs:
      - release-get-tag
      - release-from-branch
    permissions:
      contents: write
    uses: linode/apl-gh-actions/.github/workflows/release-helm-chart.yml@v0.3.0
    with:
      release_tag: ${{ needs.release-get-tag.outputs.release_tag }}
      dry_run: ${{ inputs.dry_run }}
      chart_name: 'apl'
      charts_dir: 'chart'
