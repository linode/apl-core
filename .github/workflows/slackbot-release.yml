name: Slackbot on release

on:
  release:
    types:
      - published

jobs:
  notify_slack:
    runs-on: ubuntu-latest
    name: Notify Slack on Release
    steps:
      - name: Notify Slack on Releases
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "text": ${{ toJSON(format('{0} has been released in {1}
            <{2}>

            {3}', github.event.release.name || github.event.release.tag_name, github.repository, github.event.release.html_url, github.event.release.body)) }}
            }
