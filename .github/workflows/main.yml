name: Build and publish Docker
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'adr/**'
      - '.vscode/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'adr/**'
      - '.vscode/**'
      - '**.md'
  workflow_dispatch: ~
env:
  REPO: linode/apl-core
  REGISTRY: docker.io
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_LINODEBOT_USERNAME }}
  BOT_EMAIL: ${{ vars.BOT_EMAIL }}
  BOT_USERNAME: ${{ vars.BOT_USERNAME }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build-test-cache:
    if: (!contains(github.event.head_commit.message, 'ci skip') && !startsWith(github.ref, 'refs/tags/') && !github.event.act && github.repository == 'linode/apl-core')
    runs-on: ubuntu-22.04
    env:
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Set env
        id: establish-versions
        run: |
          if [[ "$SHOULD_PUSH" == "true" ]]; then
            # github.ref_name is the merge ref (e.g. "50/merge") on pull_request events, not the
            # actual branch name, so use head_ref there; ref_name is correct for branch/tag pushes.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              ref_name="${{ github.head_ref }}"
            else
              ref_name="${{ github.ref_name }}"
            fi
            # Docker tags allow only [a-zA-Z0-9_.-]; branch/tag names (e.g. "feature/foo") may not, so sanitize.
            tag=$(echo "$ref_name" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          else
            tag="pr-${{ github.event.pull_request.number }}"
          fi
          echo "Creating tag: $tag"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            revision=${{ env.COMMIT_SHA }}
            echo "Setting apps revision to: $revision"
            echo "APPS_REVISION=$revision" >> "$GITHUB_OUTPUT"
          else
            echo "Leaving apps revision empty"
          fi
          git config --global user.email "$BOT_EMAIL"
          git config --global user.name "$BOT_USERNAME"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next minor semver version
        id: compute-version
        uses: linode/apl-gh-actions/actions/release-get-next-minor-version@v0.2.5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_LINODEBOT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}
      - name: Build, test, push
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.SHOULD_PUSH == 'true' }}
          load: true
          context: .
          build-args: |
            APPS_REVISION=${{ steps.establish-versions.outputs.APPS_REVISION }}
            VERSION=${{ steps.compute-version.outputs.version }}
          tags: ${{ env.REPO }}:${{ steps.establish-versions.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-dev:
    needs: build-test-cache
    if: always() && (startsWith(github.ref, 'refs/heads/main')) && !github.event.action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install the Linode CLI
        uses: linode/action-linode-cli@v1
        with:
          token: ${{ secrets.LINODE_TOKEN }}
      - name: Deploy to dev
        env:
          DEV_CLUSTER_ID: ${{ secrets.DEV_CLUSTER_ID }}
          LKE_CP_ACL_IPV4: ${{ secrets.LKE_CP_ACL_IPV4 }}
        run: ci/scripts/trigger_dev.sh
