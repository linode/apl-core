name: Check app URLs
on:
  push:
    branches:
      - main
    paths:
      - apps.yaml
      - ci/src/check-app-urls.ts
      - ci/src/check-app-urls.test.ts
  pull_request:
    paths:
      - apps.yaml
      - ci/src/check-app-urls.ts
      - ci/src/check-app-urls.test.ts
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  check-app-urls:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm test

      - name: Check URLs in apps.yaml
        run: npm run check-app-urls
