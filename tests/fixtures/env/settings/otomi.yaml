kind: AplCapabilitySet
metadata:
    name: otomi
spec:
    aiEnabled: true
    git:
      # Supplied in actual clusters from Secret apl-git-config
      # Kept here only for testing effect on templates
      branch: test-branch
      email: pipeline@cluster.local
      repoUrl: http://gitea-http.gitea.svc.cluster.local:3000/otomi/values.git
      username: otomi-admin
    globalPullSecret:
        username: otomi
    hasExternalDNS: true
    hasExternalIDP: false
    oidc:
        allTeamsAdminGroupID: xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        clientID: someClientID
        issuer: https://login.microsoftonline.com/xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        platformAdminGroupID: someAdminGroupID
        subClaimMapper: oid
        teamAdminGroupID: xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    isMultitenant: true
    isPreInstalled: true
    nodeSelector:
        otomi: otomi-sys
    useORCS: false
    version: main
