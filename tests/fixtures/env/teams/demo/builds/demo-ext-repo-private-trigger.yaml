kind: AplTeamBuild
metadata:
    name: demo-ext-repo-private-trigger
    labels:
        apl.io/teamId: demo
spec:
    externalRepo: true
    imageName: demo-java1
    mode:
        docker:
            path: ./Dockerfile
            repoUrl: https://github.com/buildpacks/samples
            revision: HEAD
        type: docker
    scanSource: true
    secretName: demo-ext-repo-private
    tag: v0.0.1
    trigger: true
