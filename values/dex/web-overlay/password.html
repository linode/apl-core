{{ template "header.html" . }}

<link rel="stylesheet" href="{{ url .ReqPath `static/apl.css` }}">

<div class="apl-auth">
  <div class="apl-auth__inner">
    <div class="apl-brand">
      <img
        class="apl-brand__logo"
        src="https://brandlogos.sgp1.digitaloceanspaces.com/svg/logos/akamai.svg"
        alt="Akamai"
      />
      <span class="apl-brand__divider" aria-hidden="true"></span>
      <span class="apl-brand__product">App Platform</span>
    </div>

    <main class="apl-auth__main">
      <div class="apl-card">
        <h2 class="apl-card-header">Sign in to App Platform</h2>

        <form method="post" action="{{ .PostURL }}" class="apl-form">
          <div class="apl-field">
            <label for="login">{{ .UsernamePrompt }}</label>
            <input
              tabindex="1"
              required
              id="login"
              name="login"
              type="text"
              autocomplete="username"
              placeholder="{{ .UsernamePrompt | lower }}"
              {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}
            />
          </div>

          <div class="apl-field">
            <label for="password">Password</label>
            <div class="apl-password-wrap">
              <input
                tabindex="2"
                required
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                {{ if .Invalid }}autofocus{{ end }}
              />
              <button
                class="apl-password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                tabindex="3"
              >
                Show
              </button>
            </div>
          </div>

          {{ if .Invalid }}
          <div id="login-error" class="apl-error" role="alert">
            Invalid {{ .UsernamePrompt }} and password.
          </div>
          {{ end }}

          {{ if .ShowRememberMe }}
          <label class="apl-remember">
            <input
              tabindex="4"
              type="checkbox"
              name="remember_me"
              {{ if .RememberMeChecked }}checked{{ end }}
            />
            <span>Remember me</span>
          </label>
          {{ end }}

          <button
            tabindex="5"
            id="submit-login"
            type="submit"
            class="apl-submit"
          >
            <span>Sign in</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        {{ if .BackLink }}
        <div class="apl-back">
          <a href="{{ .BackLink }}">Select another login method</a>
        </div>
        {{ end }}
      </div>
    </main>
  </div>
</div>

<script type="text/javascript">
  (function () {
    var form = document.querySelector(".apl-form");
    var submit = document.querySelector("#submit-login");
    var toggle = document.querySelector(".apl-password-toggle");
    var password = document.querySelector("#password");

    if (form && submit) {
      form.addEventListener("submit", function () {
        submit.setAttribute("disabled", "disabled");
        submit.querySelector("span:first-child").textContent = "Signing in…";
      });
    }

    if (toggle && password) {
      toggle.addEventListener("click", function () {
        var showing = password.type === "text";
        password.type = showing ? "password" : "text";
        toggle.textContent = showing ? "Show" : "Hide";
        toggle.setAttribute(
          "aria-label",
          showing ? "Show password" : "Hide password",
        );
        toggle.setAttribute("aria-pressed", String(!showing));
      });
    }
  })();
</script>

{{ template "footer.html" . }}
