{{ template "header.html" . }}

<link rel="stylesheet" href="{{ url .ReqPath `static/apl.css` }}">
<link rel="icon" href="{{ url .ReqPath `static/apl-favicon.png` }}">

<div class="apl-auth">
  <div class="apl-auth__inner">
    <div class="apl-brand">
      <img
        class="apl-brand__logo"
        src="https://www.linode.com/linode/en/images/logo/akamai-cloud-logo.svg"
        alt="Akamai"
        referrerpolicy="no-referrer"
      />
      <span class="apl-brand__divider" aria-hidden="true"></span>
      <span class="apl-brand__product">App Platform</span>
    </div>

    <main class="apl-auth__main">
      <div class="apl-card">
        <h2 class="apl-card-header">Sign in to App Platform</h2>

        <form method="post" action="{{ .PostURL }}" class="apl-form">
          <div class="apl-field">
            <label for="login">{{ .UsernamePrompt }}</label>
            <input
              tabindex="1"
              required
              id="login"
              name="login"
              type="text"
              autocomplete="username"
              placeholder="{{ .UsernamePrompt | lower }}"
              {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}
            />
          </div>

          <div class="apl-field">
            <label for="password">Password</label>
            <div class="apl-password-wrap">
              <input
                tabindex="2"
                required
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                {{ if .Invalid }}autofocus{{ end }}
              />
              <button
                class="apl-password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                tabindex="3"
              >
                Show
              </button>
            </div>
          </div>

          {{ if .Invalid }}
          <div id="login-error" class="apl-error" role="alert">
            Invalid {{ .UsernamePrompt }} and password.
          </div>
          {{ end }}

          {{ if .ShowRememberMe }}
          <label class="apl-remember">
            <input
              tabindex="4"
              type="checkbox"
              name="remember_me"
              {{ if .RememberMeChecked }}checked{{ end }}
            />
            <span>Remember me</span>
          </label>
          {{ end }}

          <button
            tabindex="5"
            id="submit-login"
            type="submit"
            class="apl-submit"
          >
            <span>Sign in</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        {{ if .BackLink }}
        <div class="apl-back">
          <a href="{{ .BackLink }}">Select another login method</a>
        </div>
        {{ end }}
      </div>
    </main>
  </div>
</div>

<script src="{{ url .ReqPath `static/apl.js` }}"></script>

{{ template "footer.html" . }}
