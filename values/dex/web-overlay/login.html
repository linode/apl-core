{{ template "header.html" . }}

<link rel="stylesheet" href="{{ url .ReqPath `static/apl.css` }}" />
<link rel="icon" href="{{ url .ReqPath `static/apl-favicon.png` }}" />

<div class="apl-auth">
  <div class="apl-auth__inner">
    <div class="apl-brand">
      <img class="apl-brand__logo" src="{{ url .ReqPath `static/apl-logo.svg` }}" alt="Akamai" />
      <span class="apl-brand__divider" aria-hidden="true"></span>
      <span class="apl-brand__product">App Platform</span>
    </div>

    <main class="apl-auth__main">
      <div class="apl-card apl-card--connectors">
        <div class="apl-card__eyebrow">WELCOME BACK</div>
        <h2>Sign in to App Platform</h2>
        <p class="apl-card__intro">Choose a sign-in method to continue.</p>

        <div class="apl-connectors">
          {{ range $c := .Connectors }}
          <div class="apl-connector-row">
            <a href="{{ $c.URL }}" class="apl-connector-btn dex-btn-provider">
              <span class="dex-btn-icon dex-btn-icon--{{ $c.Type }}" aria-hidden="true"></span>
              <span class="apl-connector-btn__text">Log in with {{ $c.Name }}</span>
            </a>
          </div>
          {{ end }}
        </div>
      </div>
    </main>
  </div>
</div>

{{ template "footer.html" . }}
