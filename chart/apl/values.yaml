# Default values for Otomi.
# This is a YAML-formatted file.
# Declare variables to be passed into chart templates.

cluster: {}

  ## Needs to be set when hasExternalDNS is set to true
  ##
  # domainSuffix: ''

  ## Set the name of your cluster
  ##
  # name: 'dev'

  ## Set provider
  ## Can be one of aws|azure|google|digitalocean|ovh|vultr|scaleway|civo|custom
  ## Choose 'custom' for Minikube and any other K8s cluster.
  ##
  # provider: 'custom'

  ## Set the owner of the cluster
  ## Can be the name of your organization. Will be set to 'otomi' if left empty
  ##
  # owner: ''

otomi:
  useORCS: true

  ## Set the admin password
  ## Will be automatically generated if not filled-in
  # adminPassword: ''

  ## Set hasExternalDNS to true when using an external DNS zone.
  ## Otherwise a '*.nip.io' domain will be created.
  # hasExternalDNS: false

  ## Set hasExternalIDP to true,when you bring your own IDP such as Azure AD.
  ## When set to false Keycloak will become the IDP.
  ## When set to true, also fill in the 'oidc:' settings below.
  # hasExternalIDP: false

  ## Set the version of Otomi
  ## By default the image tag is set to .Chart.AppVersion
  # version: main

  ## Git repository configuration
  ## By default, APL uses the built-in Gitea instance.
  git:
    # repoUrl: ''      # Repository url (e.g., https://github.com/org/repo)
    # user: ''         # Git username (defaults to 'otomi-admin')
    # password: ''     # Git password or personal access token
    # email: ''        # Email for git commits (defaults to 'pipeline@cluster.local')
    branch: main

## Optional configuration
# apps:
#   cert-manager:
    ## Set issuer
    ## Use a custom-ca (for BYO CA or auto-generated CA) or letsencrypt.
    ## When using letsencrypt, also fill in 'dns'.
    # issuer: custom-ca
    ## Set when using BYO CA.
    ## If not filled in, a CA will be auto generated
    # customRootCA:
    # customRootCAKey:
    ## Set when issuer is letsencrypt
    # email: ''
    # stage: staging # defaults to 'production' when commented out

## External dns zone configuration
# dns:
#   domainFilters: []
#   zoneIdFilters: []
#   provider:
#     # choose your DNS provider: aws|azure|google|digitalocean|civo|cloudflare|other
#     aws:
#       # credentials are optional for explicit access with an iam role
#       # (if no metadata exists with implicit role access to manage dns)
#       credentials:
#         secretKey: ''
#         accessKey: ''
#       # region is always needed
#       region: eu-central-1
#       # optional ARN, may be set explicitly if no metadata can be accessed
#       role: ''
#     azure:
#       aadClientId: ''
#       aadClientSecret: ''
#       tenantId: '' # optional
#       subscriptionId: '' # optional
#     google:
#       serviceAccountKey: ''
#       project: ''
#     digitalocean:
#       apiToken: ''
#       apiSecret: ''
#       email: ''
#       proxied: # true|false (default is true)
# Bring your own IDP, or leave commented out to use keycloak as IDP
# oidc:
#   clientID: ''
#   clientSecret: ''
#   issuer: ''
#   # IDP group id used to identify global admin
#   platformAdminGroupID: ''
#   # IDP group id used to identify all teams admin
#   allTeamsAdminGroupID: ''
#   # IDP group id used to identify team admin
#   teamAdminGroupID: ''

## Cleanup configuration
cleanup:
  # Enable the cleanup command that removes cluster-admin ClusterRoleBinding after installation
  enabled: true

# Service Account requires access to gitea pod to edit the oauth through CLI commands
serviceAccount:
  create: true
  name: "apl-operator"
  annotations: {}

# Fixed, not release-name derived: charts/apl-operator mounts it by the same name.
valuesSecretName: apl-values

# The operator always runs here, regardless of the release namespace.
namespace: apl-operator

image:
  # Empty derives it from otomi.useORCS + cluster.provider. Set to pin.
  repository: ""
  # Empty falls back to otomi.version.
  tag: ""

scale:
  replicas: 1

imagePullSecretNames: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
deploymentAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
command: []
commandArgs: []

# Keep in sync with charts/apl-operator; checked by npm run lint:operator-charts.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

# Mirrors apps.apl-operator.resources.operator in snippets/defaults.yaml.
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 128Mi

## APL Operator configuration
operator:
  # Polling interval for git changes (milliseconds)
  pollIntervalMs: 30000
  # Reconcile interval for applying changes (milliseconds)
  reconcileIntervalMs: 300000
  gitOpTimeoutMs: 10000
  installRetries: 1000
  installMaxTimeoutMs: 10000

  readiness:
    # When true, the pod is Ready only after the operator completes its first apply,
    # so `--wait` blocks for the whole install. When false, readiness is a process check
    # and the Deployment becomes Available within ~30s.
    gateOnReadiness: false
    # 30 minutes. If the operator has not installed the platform by then, something is off.
    progressDeadlineSeconds: 1800

  readiness:
    # 30 minutes. If the operator has not installed the platform by then, something is off.
    progressDeadlineSeconds: 1800

installation:
  mode: standard
  # Skip deployment of the operator
  skipOperatorDeployment: false
  ## Create namespaces (apl-operator, otomi, apl-secrets). Disable if creating them yourself.
  ## Label them `kubernetes.io/metadata.name: <name>` and `name: <name>` — NetworkPolicies match on `name`.
  ## Set this at install time; flipping it to false later makes helm delete the namespaces.
  createNamespaces: true
