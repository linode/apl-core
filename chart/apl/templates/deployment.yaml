{{- $kms := .Values.kms | default dict }}
{{- $version := .Values.otomi.version | default .Chart.AppVersion }}
{{- $skipDeployment := .Values.installation.skipOperatorDeployment }}
{{- $readiness := .Values.operator.readiness | default dict }}
{{- $gateOnInstall := ne $readiness.gateOnInstallationComplete false }}
{{- if not $skipDeployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apl-operator.fullname" . }}
  namespace: apl-operator
  labels: {{- include "apl-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Installing the platform takes considerably longer than the 600s default, and
  # with the readinessProbe gated on convergence the rollout stays Progressing
  # for that whole window. Without this, `kubectl rollout status` reports
  # ProgressDeadlineExceeded on a perfectly healthy first install.
  progressDeadlineSeconds: {{ $readiness.progressDeadlineSeconds | default 3600 }}
  selector:
    matchLabels: {{- include "apl-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels: {{- include "apl-operator.selectorLabels" . | nindent 8 }}
    spec:
      dnsConfig:
          nameservers:
            - 8.8.8.8
            - 8.8.4.4
      restartPolicy: Always
      serviceAccountName: {{ include "apl-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apl-operator
          image: "{{ .Values.operator.image.repository }}:{{ $version }}"
          imagePullPolicy: {{ ternary "IfNotPresent" "Always" (regexMatch "^v\\d" $version) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            limits:
              cpu: '2'
              memory: '2Gi'
            requests:
              cpu: '1'
              memory: '1Gi'
          workingDir: /home/app/stack
          env:
            - name: VERBOSITY
              value: '1'
            - name: ENV_DIR
              value: /home/app/stack/env
            - name: VALUES_INPUT
              value: /secret/values.yaml
            - name: POLL_INTERVAL_MS
              value: {{ .Values.operator.pollIntervalMs | quote }}
            - name: RECONCILE_INTERVAL_MS
              value: {{ .Values.operator.reconcileIntervalMs | quote }}
            - name: GIT_OP_TIMEOUT_MS
              value: {{ .Values.operator.gitOpTimeoutMs | quote }}
            - name: INSTALL_RETRIES
              value: {{ .Values.operator.installRetries | quote }}
            - name: INSTALL_MAX_TIMEOUT_MS
              value: {{ .Values.operator.installMaxTimeoutMs | quote }}
          volumeMounts:
            - name: otomi-values
              mountPath: /home/app/stack/env
            - name: values-secret
              mountPath: /secret
            - name: tmp
              mountPath: /tmp
            - name: git-config
              mountPath: /home/app/.gitconfig
              subPath: .gitconfig
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f 'apl-operator' > /dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              {{- if $gateOnInstall }}
              # Convergence signal: /tmp/ready is written by the operator once the
              # platform installation reaches the 'completed' state, so the
              # Deployment only goes Available when the helmfile pipeline has
              # actually converged. This is what makes `helm install --wait` and
              # `kubectl wait --for=condition=Available` usable as bootstrap gates.
              # NOTE: a first install takes 10-15 minutes — size --timeout accordingly.
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
              {{- else }}
              # Liveness-equivalent readiness: reports Ready as soon as the operator
              # process is up, long before the platform has converged.
              command: ["/bin/sh", "-c", "pgrep -f 'apl-operator' > /dev/null"]
              {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            # Readiness latches once installation completes; a transient probe
            # failure should not take the Deployment out of Available.
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}
      volumes:
        - name: values-secret
          secret:
            secretName: {{ .Release.Name }}-values
        - name: otomi-values
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: git-config
          configMap:
            name: git-config
            items:
              - key: .gitconfig
                path: .gitconfig
      {{- if hasKey .Values "imagePullSecretNames" }}
      imagePullSecrets:
        {{- range .Values.imagePullSecretNames }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
