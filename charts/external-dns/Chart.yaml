annotations:
  artifacthub.io/changes: |-
    - kind: added
      description: "Add value .fqdnTemplates to configure FQDN templates for generating DNS records."
    - kind: added
      description: "Add value eventsEmit to set the Kubernetes events ExternalDNS emits and grant the matching RBAC to create events.k8s.io events."
    - kind: added
      description: "Add value hostUsers to set the Pod hostUsers field, so that the Pod can run in a user namespace."
    - kind: changed
      description: "Update bundled DNSEndpoint and DNSRecord CRDs with admission validation."
    - kind: changed
      description: "Default provider.webhook.securityContext to no privilege escalation, no capabilities and a read-only root filesystem, like the external-dns container, so the Pod meets the restricted Pod Security Standard."
    - kind: changed
      description: "Update ExternalDNS OCI image version to v0.24.0."
