{{- $dot := . }}
{{- $v := .Values }}
{{- range $gateway := $v.gateways }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-{{ $gateway.name }}-options
  labels:
    {{- include "kubernetes-gateways.labels" $dot | nindent 4 }}
data:
  deployment: |
    spec:
      replicas: {{ $gateway.replicas | default 2 }}
      {{- if or $gateway.resources $gateway.nodeSelector }}
      template:
        spec:
          {{- with $gateway.nodeSelector }}
          nodeSelector:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with $gateway.resources }}
          containers:
            - name: istio-proxy
              resources:
                {{- . | toYaml | nindent 16 }}
          {{- end }}
      {{- end }}
  {{- with $gateway.hpa }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: {{ .minReplicas | default 2 }}
      maxReplicas: {{ .maxReplicas | default 2 }}
      {{- with .metrics }}
      metrics:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
