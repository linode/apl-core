apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apl-operator.fullname" . }}
  labels:
    {{- include "apl-operator.labels" . | nindent 4 }}
{{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.scale.replicas | default 1 }}
  # The rollout stays Progressing until the operator is ready, which is longer than the 600s default.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      {{- include "apl-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "apl-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apl-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /home/app/stack
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.commandArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CI
              value: "true"
            - name: POLL_INTERVAL_MS
              value: {{ .Values.operator.pollIntervalMs | quote }}
            - name: RECONCILE_INTERVAL_MS
              value: {{ .Values.operator.reconcileIntervalMs | quote }}
            - name: GIT_OP_TIMEOUT_MS
              value: {{ .Values.operator.gitOpTimeoutMs | quote }}
            - name: INSTALL_RETRIES
              value: {{ .Values.operator.installRetries | quote }}
            - name: INSTALL_MAX_TIMEOUT_MS
              value: {{ .Values.operator.installMaxTimeoutMs | quote }}
          envFrom:
            - secretRef:
                name: apl-sops-secrets
                optional: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test $(( $(date +%s) - $(date -r /tmp/heartbeat +%s) )) -le 900"
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if .Values.operator.readiness.gateOnReadiness }}
                - "test -f /tmp/ready"
                {{- else }}
                - "pgrep -f 'apl-operator' > /dev/null"
                {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: apl-values
              mountPath: /home/app/stack/env
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/app/.cache
            - name: git-config
              mountPath: /home/app/.gitconfig
              subPath: .gitconfig
      volumes:
        - name: apl-values
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: git-config
          configMap:
            name: git-config
            items:
              - key: .gitconfig
                path: .gitconfig
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
