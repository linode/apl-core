{{- /* Symlinked into chart/apl, so it renders in whichever chart owns it. */ -}}
{{- $version := .Values.image.tag | default .Values.otomi.version | default .Chart.AppVersion }}
{{- /* Mirrors the linodeLkeImageRepository derivation in snippets/derived.gotmpl. */ -}}
{{- $useORCS := and .Values.otomi.useORCS (eq (.Values.cluster.provider | default "") "linode") }}
{{- $repository := .Values.image.repository | default (ternary "mirror.registry.linodelke.net/docker/linode/apl-core" "docker.io/linode/apl-core" $useORCS) }}
{{- if not .Values.installation.skipOperatorDeployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apl-operator.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "apl-operator.labels" . | nindent 4 }}
{{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.scale.replicas | default 1 }}
  # The rollout stays Progressing until the operator is ready, which is longer than the 600s default.
  progressDeadlineSeconds: {{ .Values.operator.readiness.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "apl-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "apl-operator.selectorLabels" . | nindent 8 }}
    spec:
      # Appended to the cluster resolvers, as a fallback while CoreDNS starts.
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      {{- with .Values.imagePullSecretNames }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "apl-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apl-operator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ $repository }}:{{ $version }}"
          imagePullPolicy: {{ ternary "IfNotPresent" "Always" (regexMatch "^v?[0-9]" $version) }}
          workingDir: /home/app/stack
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.commandArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: VERBOSITY
              value: '1'
            - name: ENV_DIR
              value: /home/app/stack/env
            - name: VALUES_INPUT
              value: /secret/values.yaml
            - name: POLL_INTERVAL_MS
              value: {{ .Values.operator.pollIntervalMs | quote }}
            - name: RECONCILE_INTERVAL_MS
              value: {{ .Values.operator.reconcileIntervalMs | quote }}
            - name: GIT_OP_TIMEOUT_MS
              value: {{ .Values.operator.gitOpTimeoutMs | quote }}
            - name: INSTALL_RETRIES
              value: {{ .Values.operator.installRetries | quote }}
            - name: INSTALL_MAX_TIMEOUT_MS
              value: {{ .Values.operator.installMaxTimeoutMs | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test $(( $(date +%s) - $(date -r /tmp/heartbeat +%s) )) -le 900"
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -f /tmp/ready"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: apl-values
              mountPath: /home/app/stack/env
            - name: values-secret
              mountPath: /secret
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/app/.cache
            - name: git-config
              mountPath: /home/app/.gitconfig
              subPath: .gitconfig
      volumes:
        - name: apl-values
          emptyDir: {}
        # Optional: only exists while chart/apl owns the release.
        - name: values-secret
          secret:
            secretName: {{ .Values.valuesSecretName }}
            optional: true
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: git-config
          configMap:
            name: git-config
            items:
              - key: .gitconfig
                path: .gitconfig
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
