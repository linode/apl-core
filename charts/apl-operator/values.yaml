# Default values for apl-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # Empty derives it from otomi.useORCS + cluster.provider. Set to pin.
  repository: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: main

valuesSecretName: apl-values

# Declared so the shared deployment template resolves them here too; chart/apl sets them.
namespace: ""
otomi:
  version: ""
  useORCS: false
cluster:
  provider: ""
installation:
  skipOperatorDeployment: false

imagePullSecretNames: []
nameOverride: ""
fullnameOverride: ""

# Service Account requires access to gitea pod to edit the oauth through CLI commands
serviceAccount:
  create: true
  name: "apl-operator"
  annotations: {}

podAnnotations: {}

deploymentAnnotations: {}

# Keep in sync with chart/apl; checked by npm run lint:operator-charts.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

# Mirrors apps.apl-operator.resources.operator in snippets/defaults.yaml.
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 128Mi


## APL Operator configuration
operator:
  # Git organization/user name (will be configured during installation)
  gitOrg: "otomi"
  # Git repository name (will be configured during installation)
  gitRepo: "values"
  pollIntervalMs: 30000
  reconcileIntervalMs: 300000
  gitOpTimeoutMs: 10000
  installRetries: 1000
  installMaxTimeoutMs: 10000

  readiness:
    # 30 minutes. If the operator has not installed the platform by then, something is off.
    progressDeadlineSeconds: 1800
    gateOnReadiness: false

nodeSelector: {}

tolerations: []

affinity: {}

command: []

commandArgs: []

env: {}



scale:
  # Allowed values are 0 or 1. Setting to 0 will disable the operator deployment.
  replicas: 1
