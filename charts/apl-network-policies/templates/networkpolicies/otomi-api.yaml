{{- if .Values.netpols.otomiApi }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otomi-api-platform-policy
  namespace: otomi
  labels:
    {{- include "apl-network-policies.labels" . | nindent 4 }}
    app: otomi-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otomi-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        # Allow ingress to api endpoint
        - protocol: TCP
          port: 8080
        # Allow ingress to api endpoint for health checks
        - protocol: TCP
          port: 9000
      from:
        # Allow access from public ingress gateway
        {{- with .Values.ingressGatewaySelectors }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        # Allow monitoring access for metrics scraping
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: po-prometheus
        # Allow access from other otomi components
        - namespaceSelector:
            matchLabels:
              name: otomi
  egress:
    # DNS resolution, needed to connect to team-supplied external git hosts
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Internal Gitea and Keycloak (admin API)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
    # SSRF protection: public internet except private/reserved ranges, so a
    # user-supplied repository URL can't reach internal/cloud-metadata addresses.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.blockedEgressCidrs }}
              {{- if not (contains ":" .) }}
              - {{ . }}
              {{- end }}
              {{- end }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- range .Values.blockedEgressCidrs }}
              {{- if contains ":" . }}
              - {{ . }}
              {{- end }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
