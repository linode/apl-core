{{- if .Values.netpols.otomiApi }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otomi-api-platform-policy
  namespace: otomi
  labels:
    {{- include "apl-network-policies.labels" . | nindent 4 }}
    app: otomi-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otomi-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        # Allow ingress to api endpoint
        - protocol: TCP
          port: 8080
        # Allow ingress to api endpoint for health checks
        - protocol: TCP
          port: 9000
      from:
        # Allow access from public ingress gateway
        {{- with .Values.ingressGatewaySelectors }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        # Allow monitoring access for metrics scraping
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: po-prometheus
        # Allow access from other otomi components
        - namespaceSelector:
            matchLabels:
              name: otomi
  egress:
    {{- if .Values.otomiApi.apiServerIp }}
    # The Service's ClusterIP doesn't work here: CNIs enforce egress post-DNAT
    # against the real backend, resolved by the operator (see derived.gotmpl).
    - to:
        - ipBlock:
            cidr: {{ .Values.otomiApi.apiServerIp }}/32
      ports:
        - protocol: TCP
          port: {{ .Values.otomiApi.apiServerResolvedPort }}
    {{- end }}
    # Namespace-only: DNS pod labels (kube-dns/CoreDNS) differ across providers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Namespace-only: pod labels/ports change across Istio versions/revisions.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    {{- if .Values.otomiApi.giteaEnabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
    {{- if .Values.otomiApi.gitServerEnabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: git-server
          podSelector:
            matchLabels:
              app: git-server
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
    {{- if .Values.otomiApi.dexEnabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dex
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dex
      ports:
        - protocol: TCP
          port: 5557
    {{- end }}
    # SSRF: blocks user-supplied repo URLs from reaching internal/cloud-metadata addresses.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.otomiApi.blockedEgressCidrsV4 }}
              - {{ . }}
              {{- end }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- range .Values.otomiApi.blockedEgressCidrsV6 }}
              - {{ . }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 443
        {{- range .Values.otomiApi.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
