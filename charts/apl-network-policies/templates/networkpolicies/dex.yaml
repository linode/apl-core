{{- if .Values.netpols.dex }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-platform-policy
  namespace: dex
  labels:
    {{- include "apl-network-policies.labels" . | nindent 4 }}
    app: dex
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dex
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow access from public ingress gateway to the web login/OIDC endpoints
    - ports:
        - protocol: TCP
          port: 5556
      from:
        {{- with .Values.ingressGatewaySelectors }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
    # Allow monitoring access for metrics scraping
    - ports:
        - protocol: TCP
          port: 5558
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: po-prometheus
    # gRPC has no auth of its own; restrict to otomi-api
    - ports:
        - protocol: TCP
          port: 5557
      from:
        - namespaceSelector:
            matchLabels:
              name: otomi
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otomi-api
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Istio control plane
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Kubernetes API server — Dex stores all state (passwords, tokens, sessions, signing keys)
    # as CRDs and needs cluster-scoped API access. The ipBlock approach (post-DNAT destination)
    # works on LKE where the control-plane endpoint is a public IP.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.dex.blockedEgressCidrsV4 }}
              - {{ . }}
              {{- end }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- range .Values.dex.blockedEgressCidrsV6 }}
              - {{ . }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 443
        {{- range .Values.dex.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
