{{- if .Values.netpols.reloader }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader-platform-policy
  namespace: reloader
  labels:
    {{- include "apl-network-policies.labels" . | nindent 4 }}
    app: reloader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
  policyTypes:
    - Ingress
  ingress:
    # Allow monitoring access for metrics scraping
    - ports:
        - protocol: TCP
          port: 9090
      from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: po-prometheus
{{- end }}
