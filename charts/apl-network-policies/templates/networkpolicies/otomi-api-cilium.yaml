{{- if and .Values.netpols.otomiApi .Values.otomiApi.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otomi-api-apiserver-policy
  namespace: otomi
  labels:
    {{- include "apl-network-policies.labels" . | nindent 4 }}
    app: otomi-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otomi-api
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
