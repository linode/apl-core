apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-barman-cloud
spec:
  template:
    spec:
      containers:
        - name: barman-cloud
          args:
            - operator
            - --server-cert=/server/tls.crt
            - --server-key=/server/tls.key
            - --client-cert=/client/tls.crt
            - --server-address=:9090
            - --leader-elect
            - --log-level=trace
