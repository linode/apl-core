{{- /*
Local addition: upstream emits this unconditionally, so pointing serviceAccount.name at a
pre-existing ServiceAccount makes Helm try to create a duplicate and the install fails.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turnstone.serviceAccountName" . }}
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
