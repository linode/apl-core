{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apl-vikunja-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: true
---
# Role for configmaps and secrets in apl-vikunja-operator namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apl-vikunja-operator.fullname" . }}-configs-secrets
  namespace: apl-vikunja-operator
rules:
# Allows the operator to read and watch configmaps and secrets in the operator namespace. This is how the platform hands it the team config and the Vikunja credentials.
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "watch", "list"]
---
# RoleBinding for the above Role in apl-vikunja-operator namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apl-vikunja-operator.fullname" . }}-configs-secrets-binding
  namespace: apl-vikunja-operator
subjects:
- kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
  name: {{ include "apl-vikunja-operator.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "apl-vikunja-operator.fullname" . }}-configs-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
