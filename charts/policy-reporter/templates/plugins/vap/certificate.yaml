{{- if .Values.plugin.vap.enabled -}}
{{- if and .Values.plugin.vap.server.enabled .Values.plugin.vap.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "vap-plugin.fullname" . }}-tls
  namespace: {{ include "policyreporter.namespace" . }}
  labels:
    {{- include "vap-plugin.labels" . | nindent 4 }}
spec:
  secretName: {{ include "vap-plugin.fullname" . }}-tls
  dnsNames:
    - {{ include "vap-plugin.fullname" . }}.{{ include "policyreporter.namespace" . }}.svc
  issuerRef:
    name: {{ .Values.plugin.vap.tls.certManager.issuerRef.name }}
    kind: {{ .Values.plugin.vap.tls.certManager.issuerRef.kind }}
{{- end }}
{{- end }}
