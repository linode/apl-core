{{- if .Values.plugin.vap.enabled -}}
{{- if .Values.plugin.vap.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vap-plugin.serviceAccountName" . }}
  namespace: {{ include "policyreporter.namespace" . }}
  labels:
    {{- include "vap-plugin.labels" . | nindent 4 }}
  {{- with .Values.plugin.vap.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.plugin.vap.serviceAccount.automount }}
{{- end }}
{{- end }}
