{{- if .Values.plugin.vap.enabled -}}
{{- if and (and .Values.plugin.vap.serviceAccount.create .Values.plugin.vap.rbac.enabled) (and .Values.plugin.vap.server.enabled (gt (int .Values.plugin.vap.replicaCount) 1)) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vap-plugin.fullname" . }}-leaderelection
  namespace: {{ include "policyreporter.namespace" . }}
  labels:
    {{- include "vap-plugin.labels" . | nindent 4 }}
roleRef:
  kind: Role
  name: {{ include "vap-plugin.fullname" . }}-leaderelection
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: "ServiceAccount"
  name: {{ include "vap-plugin.serviceAccountName" . }}
  namespace: {{ include "policyreporter.namespace" . }}
{{- end }}
{{- end }}