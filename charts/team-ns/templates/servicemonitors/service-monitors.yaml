{{- $v := .Values | merge (dict) }}
{{- $alertmng := dig "managedMonitoring" "alertmanager" false $v }}
{{- if not (eq $v.teamId "admin") }}
{{- $ns := .Release.Namespace }}
{{- if $alertmng }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    prometheus: system
  name: po-alertmanager-team-{{ $v.teamId }}
  namespace: {{ $ns }}
spec:
  endpoints:
  - enableHttp2: true
    path: /metrics
    port: http-web
    relabelings:
      - targetLabel: __address__
        replacement: {{ $v.teamId }}-po-alertmanager.{{ $ns }}.svc.cluster.local:9093
  namespaceSelector:
    matchNames:
    - team-{{ $v.teamId }}
  selector:
    matchLabels:
      app: {{ $v.teamId }}-po-alertmanager
      release: prometheus-{{ $v.teamId }}
{{- end }}
---
{{- end }}
