{{- $v := .Values }}
{{- $p := index $v.policies "disallow-capabilities" }}
{{- if and $v.apps.kyverno.enabled $p $p.customValues }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: disallow-capabilities
  annotations:
    policies.kyverno.io/title: Disallow Capabilities
    policies.kyverno.io/category: baseline
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities beyond those listed in the policy must be disallowed.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
    # Istio's init container needs NET_ADMIN and NET_RAW to set up iptables
    - name: istioInitContainers
      expression: >-
        object.spec.?initContainers.orValue([]).filter(c, c.image.contains('/istio/proxyv2'))
    - name: istioInitAllowedCaps
      expression: >-
        ['NET_ADMIN', 'NET_RAW', 'AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL',
         'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
    # All other containers are checked against the configured list
    - name: regularContainers
      expression: >-
        variables.allContainers.filter(c, !c.image.contains('/istio/proxyv2'))
    - name: allowedCaps
      expression: {{ $p.customValues | toJson | quote }}
  validations:
    - message: >-
        Istio init containers may only add NET_ADMIN, NET_RAW and the allowed capabilities (AUDIT_WRITE,
        CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, MKNOD, NET_BIND_SERVICE, SETFCAP, SETGID, SETPCAP,
        SETUID, SYS_CHROOT).
      expression: >-
        variables.istioInitContainers.all(c,
          c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in variables.istioInitAllowedCaps))
    - message: >-
        Any capabilities added beyond the allowed list (AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER,
        FSETID, KILL, MKNOD, NET_BIND_SERVICE, SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT)
        are disallowed.
      expression: >-
        variables.regularContainers.all(c,
          c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in variables.allowedCaps))
{{- end }}
