{{- $v := .Values }}
{{- $p := index $v.policies "require-run-as-nonroot" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsNonRoot` is set to `true`.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  matchConditions:
    - name: exclude-tekton-tasks
      expression: {{ include "team-ns.policy.notTektonTask" . | quote }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
  validations:
    - message: >-
        Running as root is not allowed. Either the field spec.securityContext.runAsNonRoot
        must be set to `true`, or the fields spec.containers[*].securityContext.runAsNonRoot,
        spec.initContainers[*].securityContext.runAsNonRoot, and spec.ephemeralContainers[*].securityContext.runAsNonRoot
        must be set to `true`.
      expression: >-
        variables.allContainers.all(c,
          {{ include "team-ns.policy.isExemptImage" . }} ||
          c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
{{- end }}
