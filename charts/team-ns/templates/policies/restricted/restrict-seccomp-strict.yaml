{{- $v := .Values }}
{{- $p := index $v.policies "restrict-seccomp-strict" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: restrict-seccomp-strict
  annotations:
    policies.kyverno.io/title: Restrict Seccomp (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The seccomp profile in the Restricted group must not be explicitly set to Unconfined
      but additionally must also not allow an unset value. This policy,
      requiring Kubernetes v1.19 or later, ensures that seccomp is
      set to `RuntimeDefault` or `Localhost`.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  matchConditions:
    - name: exclude-tekton-tasks
      expression: {{ include "team-ns.policy.notTektonTask" . | quote }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
  validations:
    - message: >-
        Use of custom Seccomp profiles is disallowed. The fields
        spec.securityContext.seccompProfile.type,
        spec.containers[*].securityContext.seccompProfile.type,
        spec.initContainers[*].securityContext.seccompProfile.type, and
        spec.ephemeralContainers[*].securityContext.seccompProfile.type
        must be set to `RuntimeDefault` or `Localhost`.
      expression: >-
        variables.allContainers.all(c,
          {{ include "team-ns.policy.isExemptImage" . }} ||
          c.?securityContext.?seccompProfile.?type.orValue(object.spec.?securityContext.?seccompProfile.?type.orValue(''))
            in ['RuntimeDefault', 'Localhost'])
{{- end }}
