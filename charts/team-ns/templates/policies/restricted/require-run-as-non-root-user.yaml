{{- $v := .Values }}
{{- $p := index $v.policies "require-run-as-non-root-user" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-run-as-non-root-user
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsUser` is either unset or set to a number greater than zero.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  matchConditions:
    {{- include "team-ns.policy.excludeTektonTasks" . | nindent 4 }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
    {{- include "team-ns.policy.checkedContainersVar" . | nindent 4 }}
    # A container without runAsUser inherits the Pod-level value
    - name: podRunAsUser
      expression: object.spec.?securityContext.?runAsUser.orValue(0)
  validations:
    - message: >-
        Running as root is not allowed. The fields spec.securityContext.runAsUser,
        spec.containers[*].securityContext.runAsUser, spec.initContainers[*].securityContext.runAsUser,
        and spec.ephemeralContainers[*].securityContext.runAsUser must be unset or
        set to a number greater than zero.
      expression: >-
        variables.checkedContainers.all(c,
          c.?securityContext.?runAsUser.orValue(variables.podRunAsUser) > 0)
{{- end }}
