{{- $v := .Values }}
{{- $p := index $v.policies "disallow-capabilities-strict" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: disallow-capabilities-strict
  annotations:
    policies.kyverno.io/title: Disallow Capabilities (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities other than `NET_BIND_SERVICE` is disallowed. In addition,
      all containers must explicitly drop `ALL` capabilities.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
    - name: notTektonTask
      expression: {{ include "team-ns.policy.notTektonTask" . | quote }}
  validations:
    - message: >-
        Containers must drop `ALL` capabilities.
      expression: >-
        !variables.notTektonTask ||
        variables.allContainers.all(c,
          {{ include "team-ns.policy.isExemptImage" . }} ||
          'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
    - message: >-
        Any capabilities added other than NET_BIND_SERVICE are disallowed.
      expression: >-
        variables.allContainers.all(c,
          c.image.contains('/istio/proxyv2') ||
          c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap == 'NET_BIND_SERVICE'))
{{- end }}
