{{- $v := .Values }}
{{- $p := index $v.policies "require-liveness-probe" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-pod-liveness-probe
  annotations:
    policies.kyverno.io/title: Require Pod Liveness Probe
    policies.kyverno.io/category: best-practice
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Liveness probes need to be configured to correctly manage a Pod's
      lifecycle during deployments, restarts, and upgrades. For each Pod, a periodic
      `livenessProbe` is performed by the kubelet to determine if the Pod's containers
      are running or need to be restarted. This policy validates that all containers have a livenessProbe defined.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, statefulsets]
  matchConditions:
    - name: exclude-tekton-tasks
      expression: {{ include "team-ns.policy.notTektonTask" . | quote }}
    - name: exclude-team-monitoring-and-tty
      expression: >-
        !(object.metadata.?labels[?'app.kubernetes.io/instance'].orValue('') in
          [{{ printf "%s-po-alertmanager" $v.teamId | quote }}, {{ printf "prometheus-%s" $v.teamId | quote }}, {{ printf "tekton-dashboard-%s" $v.teamId | quote }}]) &&
        object.metadata.?labels[?'otomi'].orValue('') != 'tty'
  validations:
    - message: "Liveness probe is required for all containers."
      expression: >-
        object.spec.containers.all(c, has(c.livenessProbe))
{{- end }}
