{{- $v := .Values }}
{{- $p := index $v.policies "allowed-image-repositories" }}
{{- if and $v.apps.kyverno.enabled $p }}
{{- $exempt := list "docker.io/istio/proxyv2" "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-" "docker.io/grafana/grafana" "quay.io/kiwigrid/k8s-sidecar" "quay.io/prometheus/alertmanager" "quay.io/prometheus-operator/prometheus-config-reloader" "gcr.io/tekton-releases/github.com/tektoncd/dashboard/cmd/dashboard" }}
{{- with $v.linodeLkeImageRepository }}
{{- $exempt = list (printf "%s/docker/istio/proxyv2" .) (printf "%s/ghcr/open-telemetry/opentelemetry-operator/autoinstrumentation-" .) (printf "%s/docker/grafana/grafana" .) (printf "%s/quay/kiwigrid/k8s-sidecar" .) (printf "%s/quay/prometheus/alertmanager" .) (printf "%s/quay/prometheus-operator/prometheus-config-reloader" .) (printf "%s/gcr/tekton-releases/github.com/tektoncd/dashboard/cmd/dashboard" .) }}
{{- end }}
{{- $allowedRegexes := list }}
{{- range $p.customValues }}
{{- $allowedRegexes = append $allowedRegexes (include "team-ns.policy.globToRegex" .) }}
{{- end }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: allowed-image-repos
  annotations:
    policies.kyverno.io/title: Allowed Image Repositories
    policies.kyverno.io/category: best-practice
    policies.kyverno.io/severity: {{ $p.severity }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      In addition to restricting the image registry from which images are pulled, in some cases
      and environments it may be required to also restrict which image repositories are used,
      for example in some restricted Namespaces. This policy ensures that the only allowed
      image repositories present in a given Pod, across any container type, come from the
      designated list.
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  matchConditions:
    - name: exclude-tekton-tasks
      expression: {{ include "team-ns.policy.notTektonTask" . | quote }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
    - name: exemptPrefixes
      expression: {{ $exempt | toJson | quote }}
    - name: allowedRegexes
      expression: {{ $allowedRegexes | toJson | quote }}
  validations:
    - message: >-
        All images in this Pod must come from an authorized repository.
      expression: >-
        variables.allContainers.all(c,
          variables.exemptPrefixes.exists(prefix, c.image.startsWith(prefix)) ||
          c.image.startsWith({{ printf "%s/" $v.harborDomain | quote }}) ||
          variables.allowedRegexes.exists(re, c.image.matches(re)))
{{- end }}
