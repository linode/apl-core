{{- $v := .Values }}
{{- $p := index $v.policies "require-non-root-groups" }}
{{- if and $v.apps.kyverno.enabled $p }}
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-non-root-groups
  annotations:
    policies.kyverno.io/category: other
    policies.kyverno.io/severity: {{ $p.severity | quote }}
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should be forbidden from running with a root primary or supplementary GID.
      This policy ensures the `runAsGroup`, `supplementalGroups`, and `fsGroup` fields are set to a number
      greater than zero (i.e., non root).
  labels: {{- include "team-ns.chart-labels" $ | nindent 4 }}
spec:
  {{- include "team-ns.policy.podSpec" $p | nindent 2 }}
  variables:
    {{- include "team-ns.policy.allContainersVar" . | nindent 4 }}
    {{- include "team-ns.policy.checkedContainersVar" . | nindent 4 }}
    # Only the runAsGroup check below exempts Tekton task Pods
    - name: isTektonTask
      expression: {{ include "team-ns.policy.isTektonTask" . | quote }}
    # A container without runAsGroup inherits the Pod-level value
    - name: podRunAsGroup
      expression: object.spec.?securityContext.?runAsGroup.orValue(0)
  validations:
    - message: >-
        Running with root group IDs is disallowed. The fields
        spec.securityContext.runAsGroup, spec.containers[*].securityContext.runAsGroup,
        spec.initContainers[*].securityContext.runAsGroup, and
        spec.ephemeralContainers[*].securityContext.runAsGroup must be
        set to a value greater than zero.
      expression: >-
        variables.isTektonTask ||
        variables.checkedContainers.all(c,
          c.?securityContext.?runAsGroup.orValue(variables.podRunAsGroup) > 0)
    - message: >-
        Containers cannot run with a root primary or supplementary GID. The field
        spec.securityContext.supplementalGroups must be unset or
        set to a value greater than zero.
      expression: >-
        object.spec.?securityContext.?supplementalGroups.orValue([]).all(g, g > 0)
    - message: >-
        Containers cannot run with a root primary or supplementary GID. The field
        spec.securityContext.fsGroup must be unset or set to a value greater than zero.
      expression: >-
        object.spec.?securityContext.?fsGroup.orValue(1) > 0
{{- end }}
