{{- $v := .Values }}

{{- $autoUpdaterApps := list }}
{{- range $v.workloads }}
  {{- $a := .imageUpdateStrategy }}
  {{- if and $a (ne $a.type "disabled") }}
  {{ $autoUpdaterApps = append $autoUpdaterApps . }}
  {{- end }}
{{- end }}
{{ if $autoUpdaterApps }}
{{- if $v.apps.harbor.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: team-{{ $v.teamId }}-harbor-pullsecret
spec:
  conditions:
    - namespaces:
        - argocd
  provider:
    kubernetes:
      remoteNamespace: team-{{ $v.teamId }}
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store-sa
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: team-{{ $v.teamId }}-harbor-pullsecret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: team-{{ $v.teamId }}-harbor-pullsecret
    kind: ClusterSecretStore
  target:
    name: team-{{ $v.teamId }}-harbor-pullsecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: harbor-pullsecret
---
{{- end }}
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: team-{{ $v.teamId }}
  namespace: argocd
spec:
  commonUpdateSettings:
    forceUpdate: true
    pullSecret: pullsecret:argocd/team-{{ $v.teamId }}-harbor-pullsecret
  applicationRefs:
    {{- range $autoUpdaterApps }}
    {{- $a := .imageUpdateStrategy }}
    - namePattern: "team-{{ $v.teamId }}-{{ .name }}"
      images:
        - alias: "team-{{ $v.teamId }}-{{ .name }}"
          commonUpdateSettings:
            updateStrategy: {{ $a.type | quote }}
          {{- if eq $a.type "semver" }}
          imageName: "{{ $a.semver.imageRepository }}:{{ $a.semver.versionConstraint }}"
          manifestTargets:
            helm:
              name: {{ $a.semver.imageParameter | default "image.name" | quote }}
              tag: {{ $a.semver.tagParameter | default "image.tag" | quote }}
          {{- else if eq $a.type "digest" }}
          imageName: "{{ $a.digest.imageRepository }}:{{ $a.digest.tag }}"
          manifestTargets:
            helm:
              name: {{ $a.digest.imageParameter | default "image.name" | quote }}
              tag: {{ $a.digest.tagParameter | default "image.tag" | quote }}
          {{- end }}
      writeBackConfig:
        method: git
        gitConfig:
          branch: {{ $v.gitOps.branch | quote }}
          repository: {{ $v.gitOps.workloadValuesRepoUrl | quote }}
          writeBackTarget: "helmvalues:/env/teams/{{ $v.teamId }}/workloadValues/{{ .name }}.managed.yaml"
    {{- end }}
{{- end }}
