{{- $v := .Values }}
{{- range $v.workloads }}
{{- $workload := . }}
{{- $includeManagedValuesFile := false }}
{{- if and $workload.imageUpdateStrategy $workload.imageUpdateStrategy.type  }}
{{- $includeManagedValuesFile = not (eq  $workload.imageUpdateStrategy.type  "disabled") }}
{{- end }}
{{- /* Absolute paths, in the values repo, of every values file this Application reads */}}
{{- $valuesDir := printf "/env/teams/%s/workloadValues" $v.teamId }}
{{- $valuesFiles := list (printf "%s/%s.yaml" $valuesDir $workload.name) }}
{{- if $includeManagedValuesFile }}
{{- $valuesFiles = append $valuesFiles (printf "%s/%s.managed.yaml" $valuesDir $workload.name) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'team-{{ $v.teamId }}-{{ .name }}'
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- /* One annotation applies to every source, so it covers the chart source (".") and the values files */}}
    {{- with include "team-ns.manifestGeneratePaths" (dict "Values" $v "paths" $valuesFiles) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if eq $v.teamId "admin" }}
    # Admin workloads use ServerSideApply, which implies Server-Side Diff since Argo CD 3.6.
    # Set it explicitly and include mutation webhooks, consistent with the core apps.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    {{- end }}
spec:
  {{- if and ( eq $v.teamId "admin" ) .namespace }}
  project: 'default' # project is not restricted
  {{- else }}
  project: 'team-{{ $v.teamId }}' # project is restricted
  {{- end }}
  sources:
  - repoURL: '{{ .url }}'
    targetRevision: '{{ .revision }}'
    path: '{{ .path }}'
    chart: '{{ .chart }}'
    helm:
      releaseName: '{{ .name }}'
      {{- if and (.sidecarInject) (.createNamespace) }}
      parameters:
        - name: sidecar.istio.io/inject
          value: 'true'
        {{- if $v.apps.istio.defaultRevision }}
        - name: istio.io/rev
          value: {{ $v.apps.istio.defaultRevision | quote }}
        {{- end }}
      {{- end }}
      valueFiles:
      {{- range $valuesFiles }}
      - $values{{ . }}
      {{- end }}
  - repoURL: {{ $v.gitOps.workloadValuesRepoUrl | quote }}
    targetRevision: {{ printf "refs/heads/%s" $v.gitOps.branch | quote }}
    ref: values
  syncPolicy:
    automated:
      allowEmpty: false
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 3
      limit: 3
    {{- if eq $v.teamId "admin" }}
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      {{- if .createNamespace }}
      - CreateNamespace=true
      {{- end }}
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
      - '.webhooks[]?.clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
      - '.webhooks[]?.clientConfig.caBundle'
    - group: "apps"
      kind: "StatefulSet"
      jqPathExpressions:
        - ".spec.volumeClaimTemplates[].apiVersion"
        - ".spec.volumeClaimTemplates[].kind"
        - ".spec.volumeClaimTemplates[].spec"
    {{- end }}
  destination:
    server: 'https://kubernetes.default.svc'
    {{- if and ( eq $v.teamId "admin" ) .namespace }}
    namespace: '{{- .namespace }}'
    {{- else }}
    namespace: 'team-{{ $v.teamId }}'
    {{- end }}
{{- end }}
